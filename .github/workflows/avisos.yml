name: Avisos AEMET

on:
  schedule:
    - cron: "7,37 * * * *"   # cada 30 min (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # para la renovación de abajo

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas
        run: python -m unittest -v test_avisos test_mapa test_observacion test_salud

      - name: Descargar y filtrar avisos
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python avisos.py site/avisos.json

      # Lluvia medida en las estaciones. Si falla, los avisos se publican igual.
      - name: Observaciones de las estaciones
        continue-on-error: true
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python observacion.py site/observacion.json

      # Cada 3 horas se pide de nuevo a Open-Meteo; entre medias se vuelve a
      # publicar el mapa anterior. Si falla, los avisos se publican igual.
      - name: Mapa animado
        continue-on-error: true
        run: python mapa.py site/mapa.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub desactiva las tareas programadas de un repo público tras 60 días
      # sin actividad; volver a activarla reinicia ese plazo.
      - name: Mantener activa la tarea programada
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/avisos.yml/enable"

      # El mapa y las observaciones vuelven a publicar lo anterior si fallan, y
      # así nadie se entera. Si algo lleva horas sin renovarse, este paso falla
      # (después de publicar) para que GitHub mande un correo: al quedarse viejo
      # y luego una vez al día mientras siga así.
      - name: Comprobar que los datos están al día
        run: python salud.py site
