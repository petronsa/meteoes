name: Avisos AEMET

on:
  schedule:
    - cron: "7,37 * * * *"   # cada 30 min (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # para la renovación de abajo

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas
        run: python -m unittest -v test_avisos

      - name: Descargar y filtrar avisos
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python avisos.py site/avisos.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub desactiva las tareas programadas de un repo público tras 60 días
      # sin actividad; volver a activarla reinicia ese plazo.
      - name: Mantener activa la tarea programada
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/avisos.yml/enable"
