name: Avisos AEMET

on:
  schedule:
    # De respaldo: GitHub se salta muchas. La que manda es la cadena del final.
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # para la renovación de abajo

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # incluye la espera hasta el siguiente turno
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas
        run: python -m unittest -v test_avisos test_mapa test_observacion test_salud test_auditoria test_cadena

      - name: Descargar y filtrar avisos
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python avisos.py site/avisos.json

      # Lluvia medida en las estaciones. Si falla, los avisos se publican igual.
      - name: Observaciones de las estaciones
        continue-on-error: true
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python observacion.py site/observacion.json

      # Cada 3 horas se pide de nuevo a Open-Meteo; entre medias se vuelve a
      # publicar el mapa anterior. Si falla, los avisos se publican igual.
      - name: Mapa animado
        continue-on-error: true
        run: python mapa.py site/mapa.json

      # Resultados de la auditoría: los genera auditoria.yml en la rama «auditoria».
      - name: Datos de la auditoría
        continue-on-error: true
        run: |
          git fetch --depth=1 origin auditoria
          mkdir -p site/auditoria
          git archive FETCH_HEAD web | tar -x --strip-components=1 -C site/auditoria

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # A veces GitHub aún no ve el archivo recién subido y la publicación falla con
      # «No artifacts named github-pages were found»; se reintenta una vez.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Esperar antes de reintentar
        if: steps.deploy.outcome == 'failure'
        run: sleep 20
      - name: Reintentar la publicación
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # GitHub desactiva las tareas programadas de un repo público tras 60 días
      # sin actividad; volver a activarla reinicia ese plazo.
      - name: Mantener activa la tarea programada
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/avisos.yml/enable"

      # El mapa y las observaciones vuelven a publicar lo anterior si fallan, y
      # así nadie se entera. Si algo lleva horas sin renovarse, este paso falla
      # (después de publicar) para que GitHub mande un correo: al quedarse viejo
      # y luego una vez al día mientras siga así.
      - name: Comprobar que los datos están al día
        run: python salud.py site

      # GitHub se salta muchas ejecuciones programadas (llegaba a 3 o 4 al día).
      # Esta espera al siguiente turno (minuto 7 o 37) y lanza la siguiente; corre
      # aunque algo haya fallado, para que un fallo suelto no pare la cadena.
      # Cancelar una ejecución en GitHub la para hasta la siguiente programada.
      - name: Lanzar la siguiente ejecución
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python cadena.py avisos.yml 7,37
