name: Auditoría

# Cada hora guarda lo que muestra la app en los sitios de auditoria_lugares.json
# y lo que miden sus estaciones de AEMET (y sus boyas, si tienen), y rehace los
# resultados. Todo se guarda en la rama «auditoria» (así main no se llena de
# commits); la tarea de los avisos copia su carpeta web/ a la página.
on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # para la renovación del final

concurrency:
  group: auditoria
  cancel-in-progress: false

jobs:
  auditar:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"   # los mensajes salen en el registro según ocurren
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas
        run: python -m unittest -v test_auditoria

      # Para leer los archivos NetCDF de las boyas.
      - name: Librerías
        run: pip install --quiet netCDF4

      - name: Preparar la rama de datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin auditoria; then
            git fetch --depth=1 origin auditoria
            git worktree add --detach datos FETCH_HEAD
          else
            git worktree add --detach datos
            git -C datos switch --orphan auditoria
          fi

      # Si falla una parte, las demás siguen; el resumen se hace con lo que haya.
      - name: Foto de lo que muestra la app
        continue-on-error: true
        run: python auditoria.py foto datos

      - name: Medidas de las estaciones
        continue-on-error: true
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python auditoria.py medir datos

      - name: Olas medidas por las boyas (solo sitios con boya)
        continue-on-error: true
        run: python auditoria.py boyas datos

      - name: Resultados
        run: python auditoria.py resumir datos

      - name: Guardar
        run: |
          cd datos
          git add -A
          if git diff --cached --quiet; then
            echo "Nada nuevo"
            exit 0
          fi
          git commit -q -m "Auditoría $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:refs/heads/auditoria

      # GitHub desactiva las tareas programadas de un repo público tras 60 días
      # sin actividad; volver a activarla reinicia ese plazo.
      - name: Mantener activa la tarea programada
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/auditoria.yml/enable"
